<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#17324d"><meta name="description" content="Registre e consulte suas atividades diárias no Diário de Bordo."><title>Diário de Bordo</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png" type="image/png"><link rel="stylesheet" href="style.min.css"><script src="script.min.js" defer></script></head><body><header class="topo"><div class="container topo-conteudo"><div><p class="etiqueta">SEU ESPAÇO PESSOAL</p><h1>Diário de Bordo</h1><p class="subtitulo">Registre os momentos e acompanhe sua jornada.</p></div><button id="installButton" class="botao botao-secundario" hidden>Instalar aplicativo</button></div></header><main class="container layout"><section class="painel formulario-painel"><h2>Nova entrada</h2><p class="texto-ajuda">O que aconteceu no seu dia?</p><form id="entryForm"><label for="title">Título</label><input id="title" name="title" type="text" maxlength="70" placeholder="Ex.: Primeiro dia no projeto" required><label for="description">Descrição</label><textarea id="description" name="description" rows="5" maxlength="1000" placeholder="Conte um pouco sobre essa atividade..." required></textarea><label for="date">Data</label><input id="date" name="date" type="date" required><button class="botao botao-principal" type="submit">Salvar entrada</button><p id="formMessage" class="mensagem" role="status" aria-live="polite"></p></form></section><section class="lista-area"><div class="lista-cabecalho"><div><h2>Minhas entradas</h2><p class="texto-ajuda">Suas anotações ficam salvas neste dispositivo.</p></div><span id="entryCount" class="contador">0 entradas</span></div><div id="entriesList" class="entradas-lista" aria-live="polite"></div></section></main><footer class="rodape"><p>Diário de Bordo · Seus registros, sempre com você.</p><p id="connectionStatus" class="status-conexao">Verificando conexão...</p></footer></body></html>
